<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0A0B0F">
<title>Matchly Club Contentdesk</title>
<style>
:root{--bg:#0A0B0F;--panel:#12141A;--panel2:#171A22;--line:rgba(255,255,255,.09);--text:#F5F7FA;--muted:#9198A5;--gold:#D7B35A;--green:#4DD4A8;--blue:#7DA7FF;--amber:#F3C969}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:32px}button{font:inherit}
.shell{max-width:920px;margin:0 auto;padding:20px 16px 32px}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:2.1px;text-transform:uppercase}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}.top h1{font-size:29px;line-height:1.08;margin:5px 0 5px;letter-spacing:-.6px}.sub{color:var(--muted);font-size:14px;line-height:1.45;max-width:560px}.wa{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}.stat strong{display:block;font-size:23px;margin-top:4px}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin:0 0 20px}.filter{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}.filter.active{color:#0A0B0F;background:var(--gold);border-color:var(--gold)}.day{margin:0 0 22px}.day-title{text-transform:capitalize;font-weight:900;font-size:17px;margin:0 0 9px}.cards{display:grid;gap:9px}.card{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:15px;padding:13px;text-align:left;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto;gap:11px;align-items:center}.time{color:var(--muted);font-size:13px;font-weight:800}.scope{font-size:10px;color:var(--gold);font-weight:900;text-transform:uppercase;letter-spacing:1px}.title{font-size:16px;font-weight:900;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.type{color:var(--muted);font-size:12px;margin-top:3px}.badge{font-size:9px;font-weight:900;border:1px solid var(--line);border-radius:999px;padding:4px 6px;text-transform:uppercase}.badge.draft{color:var(--amber)}.badge.ready{color:var(--green)}.badge.suggested{color:var(--blue)}.arrow{color:var(--muted);font-size:22px;margin-left:4px}.empty,.state{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;color:var(--muted);line-height:1.5}.state{text-align:center;margin-top:40px}.state strong{display:block;color:var(--text);font-size:20px;margin-bottom:7px}.state a{color:var(--gold)}.readonly{display:inline-flex;gap:6px;align-items:center;margin-top:9px;border:1px solid rgba(77,212,168,.25);background:rgba(77,212,168,.07);color:var(--green);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:20;padding:16px;overflow:auto;display:none}.overlay.open{display:block}.detail{max-width:680px;margin:28px auto;background:#101218;border:1px solid var(--line);border-radius:18px;padding:18px;position:relative}.close{position:absolute;right:11px;top:8px;border:0;background:transparent;color:var(--text);font-size:29px;cursor:pointer}.detail-label{color:var(--gold);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1.2px}.detail h2{font-size:22px;margin:5px 36px 14px 0}.caption-title{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:7px}.caption{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.55;font-size:14px}.copy{border:0;background:var(--gold);color:#0A0B0F;border-radius:10px;padding:10px 13px;font-weight:900;margin-top:10px;cursor:pointer}.note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
@media(max-width:560px){.shell{padding-top:17px}.top h1{font-size:25px}.sub{font-size:13px}.wa{padding:8px 10px}.card{grid-template-columns:45px 1fr auto}.stat{padding:10px}.stat strong{font-size:20px}}
</style>
</head>
<body>
<div id="app" class="shell"><div class="state"><strong>Contentdesk laden…</strong>Een moment.</div></div>
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-hidden="true"><div class="detail"><button id="close" class="close" type="button" aria-label="Sluiten">×</button><div id="detail-content"></div></div></div>
<script>
(function(){
  'use strict';
  var API='https://qoemlqlhnrzvyujyehnc.supabase.co/functions/v1/process-whatsapp-webhook-queue';
  var TOKEN_KEY='matchly.club_contentdesk.pilot.token';
  var WA='https://wa.me/31620767042?text=clubmenu';
  var app=document.getElementById('app');
  var overlay=document.getElementById('overlay');
  var detail=document.getElementById('detail-content');
  var data=null;
  var filter='all';

  function readToken(){
    var u=new URL(location.href);
    var fromUrl=(u.searchParams.get('token')||'').trim();
    if(fromUrl){
      sessionStorage.setItem(TOKEN_KEY,fromUrl);
      u.searchParams.delete('token');
      history.replaceState({},document.title,u.pathname+(u.search||'')+u.hash);
      return fromUrl;
    }
    return sessionStorage.getItem(TOKEN_KEY)||'';
  }
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
  function typeLabel(t){var m={club_announcement:'Mededeling',club_news:'Clubnieuws',sponsor_spotlight:'Sponsor uitgelicht',new_sponsor:'Nieuwe sponsor',volunteer_of_month:'Vrijwilliger van de maand',pupil_of_the_week:'Pupil van de week',jubilee:'Jubileum',event:'Evenement',vacancy:'Vacature',weekend_preview:'Weekend vooruitblik',results_roundup:'Uitslagenoverzicht',matchday:'Matchday',result:'Result',motm:'MOTM'};return m[t]||t||'Content'}
  function statusLabel(s){return s==='draft'?'Concept':s==='ready'?'Klaar':s==='suggested'?'Voorstel':s}
  function dayKey(v){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v))}
  function dayLabel(k){return new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/Amsterdam'}).format(new Date(k+'T12:00:00+02:00'))}
  function timeLabel(v){return new Intl.DateTimeFormat('nl-NL',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Amsterdam'}).format(new Date(v))}
  function captionOf(item){var a=(item.assets||[]).find(function(x){return x.asset_type==='caption'});return a&&a.text_content?String(a.text_content):''}

  function state(title,message){app.innerHTML='<div class="state"><strong>'+esc(title)+'</strong>'+esc(message||'')+'<div style="margin-top:14px"><a href="'+WA+'">Terug naar Matt in WhatsApp</a></div></div>'}

  function render(){
    var items=(data.items||[]).filter(function(x){return filter==='all'||x.status===filter});
    var groups={};
    items.forEach(function(item){var k=dayKey(item.occurred_at);(groups[k]||(groups[k]=[])).push(item)});
    var keys=Object.keys(groups).sort().reverse();
    var counts=data.counts||{};
    var html='<div class="top"><div><div class="eyebrow">Matchly Club</div><h1>'+esc(data.club.name)+' Contentdesk</h1><div class="sub">Alle clubcontent die Matt voor jullie verzamelt op één plek.</div><div class="readonly">● Alleen bekijken</div></div><a class="wa" href="'+WA+'">← WhatsApp</a></div>';
    html+='<div class="stats"><div class="stat"><small>Concepten</small><strong>'+Number(counts.draft||0)+'</strong></div><div class="stat"><small>Klaar</small><strong>'+Number(counts.ready||0)+'</strong></div><div class="stat"><small>Voorstellen</small><strong>'+Number(counts.suggested||0)+'</strong></div></div>';
    html+='<div class="filters">'+[['all','Alles'],['draft','Concepten'],['ready','Klaar'],['suggested','Voorstellen']].map(function(x){return '<button class="filter '+(filter===x[0]?'active':'')+'" data-filter="'+x[0]+'" type="button">'+x[1]+'</button>'}).join('')+'</div>';
    if(!keys.length){html+='<div class="empty">Geen content binnen deze selectie.</div>'}
    keys.forEach(function(k){html+='<section class="day"><div class="day-title">'+esc(dayLabel(k))+'</div><div class="cards">';groups[k].forEach(function(item){html+='<button class="card" type="button" data-id="'+esc(item.id)+'"><div class="time">'+esc(timeLabel(item.occurred_at))+'</div><div><div class="scope">'+esc(item.scope==='club'?'Clubbreed':(item.team_name||'Team'))+'</div><div class="title">'+esc(item.title||typeLabel(item.content_type))+'</div><div class="type">'+esc(typeLabel(item.content_type))+'</div></div><div style="display:flex;align-items:center"><span class="badge '+esc(item.status)+'">'+esc(statusLabel(item.status))+'</span><span class="arrow">›</span></div></button>'});html+='</div></section>'});
    app.innerHTML=html;
    app.querySelectorAll('[data-filter]').forEach(function(b){b.addEventListener('click',function(){filter=b.getAttribute('data-filter')||'all';render()})});
    app.querySelectorAll('[data-id]').forEach(function(b){b.addEventListener('click',function(){openItem(b.getAttribute('data-id'))})});
  }

  function openItem(id){
    var item=(data.items||[]).find(function(x){return x.id===id});if(!item)return;
    var caption=captionOf(item);
    detail.innerHTML='<div class="detail-label">'+esc(item.scope==='club'?'Clubbreed':(item.team_name||'Team'))+' · '+esc(statusLabel(item.status))+'</div><h2>'+esc(item.title||typeLabel(item.content_type))+'</h2>'+(caption?'<div class="caption-title">Caption</div><div id="caption" class="caption"></div><button id="copy" type="button" class="copy">Kopieer tekst</button>':'<div class="empty">Er staat nog geen caption bij dit item.</div>')+'<div class="note">Dit is de read-only Club-pilot. Bewerken en beeldgeneratie zijn nog niet geactiveerd.</div>';
    if(caption)document.getElementById('caption').textContent=caption;
    var copy=document.getElementById('copy');if(copy)copy.addEventListener('click',async function(){try{await navigator.clipboard.writeText(caption);copy.textContent='Gekopieerd ✓'}catch(e){copy.textContent='Kopiëren mislukt'}});
    overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');
  }
  function close(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true')}
  document.getElementById('close').addEventListener('click',close);overlay.addEventListener('click',function(e){if(e.target===overlay)close()});

  async function load(){
    var token=readToken();
    if(!/^[a-f0-9]{48}$/i.test(token)){sessionStorage.removeItem(TOKEN_KEY);state('Contentdesk-link ontbreekt','Open de Contentdesk opnieuw via Matt in WhatsApp.');return}
    try{
      var r=await fetch(API,{method:'GET',headers:{'X-Matchly-Management-Token':token},cache:'no-store',credentials:'omit'});
      var b=await r.json().catch(function(){return null});
      if(!r.ok||!b||b.ok!==true){if(r.status===401||r.status===403)sessionStorage.removeItem(TOKEN_KEY);throw new Error(r.status===401||r.status===403?'Deze Contentdesk-link is niet meer geldig. Open hem opnieuw via Matt.':'De Contentdesk kon niet worden geladen.')}
      if(b.read_only!==true||Number(b.club&&b.club.id)!==1557)throw new Error('Deze Contentdesk is niet beschikbaar.');
      data=b;render();
    }catch(e){state('Contentdesk niet beschikbaar',e&&e.message?e.message:'Probeer het opnieuw via Matt in WhatsApp.')}
  }
  load();
})();
</script>
</body>
</html>
