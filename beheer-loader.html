<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matchly beheer</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a10;color:#9494a3;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    .error{max-width:420px;padding:24px;text-align:center;line-height:1.5}
  </style>
</head>
<body>
  <div id="status">Bezig met laden&hellip;</div>
  <script>
    (async function () {
      try {
        var response = await fetch('/beheer.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('beheerpagina niet beschikbaar');
        var html = await response.text();
        var script = '<script src="/beheer-wedstrijd-edit.js?v=20260804"><\/script>';
        html = html.indexOf('</body>') >= 0 ? html.replace('</body>', script + '</body>') : html + script;
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('status').className = 'error';
        document.getElementById('status').textContent = 'De beheerpagina kon niet worden geladen. Ververs de pagina of probeer het later opnieuw.';
      }
    })();
  </script>
</body>
</html>
